name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:hardware-runtime
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  compile-sketches:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [uno-r3, esp32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-${{ matrix.board }}-${{ hashFiles('src/hardware/targets.ts') }}
      - name: Install locked core and libraries, compile 18 sketches
        run: npm run compile:sketches -- ${{ matrix.board }} --install

  deploy:
    needs: [build, compile-sketches]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy trial site
        id: deployment
        uses: actions/deploy-pages@v4
